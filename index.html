<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダイヤマーク練習用</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
        }

        .container {
            background-color: #fff;
            padding: 2em;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
        }

        h1 {
            color: #1a237e;
            margin-top: 0;
        }

        #start-screen p {
            font-size: 1.1em;
            margin-bottom: 2em;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            background-color: #1e88e5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            text-decoration: none;
        }

        .btn:hover:not(:disabled) {
            background-color: #1565c0;
            transform: translateY(-2px);
        }

        #quiz-screen {
            display: none;
        }

        .diamond-display {
            width: 120px;
            height: 120px;
            margin: 1.5em auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #777; /* 画像の背景色に合わせて調整 */
            border-radius: 8px; /* 角を少し丸める */
        }
        
        /* CSSでダイヤマークを表現 */
        .diamond {
            width: 50px; /* 基本サイズ */
            height: 50px;
            position: relative;
            transform: rotate(45deg); /* 基本のダイヤ型に回転 */
        }

        /* id: 1 の新しいスタイル */
        .d-1 { 
            width: 60px; /* サイズ調整 */
            height: 60px;
            background-color: transparent; /* 背景は透過 */
            border: none; /* 外側の線はなし */
        }
        .d-1::before,
        .d-1::after {
            content: '';
            position: absolute;
            background-color: white; /* 白い部分 */
            transform: skew(-15deg, -15deg); /* 傾きを調整 */
            width: 25px; /* 帯の幅 */
            height: 85px; /* 帯の長さ */
            top: -12px;
        }
        .d-1::before {
            left: 5px; /* 左側の帯の位置 */
            transform: rotate(0deg) skew(20deg, 20deg);
        }
        .d-1::after {
            left: 35px; /* 右側の帯の位置 */
            transform: rotate(0deg) skew(20deg, 20deg);
        }

        /* その他のダイヤマークのスタイル (既存のスタイル) */
        .d-0 { transform: rotate(45deg) scale(1.4); background-color: white; border: 2px solid #333;}
        .d-2 { transform: rotate(45deg) skew(25deg, 25deg) scale(1.2); border-color: #666; background-color: white; border: 2px solid #333;}
        .d-3 { transform: rotate(45deg) skew(15deg, 15deg) scale(1.3); border: 4px double #333; background-color: white;}
        .d-4 { transform: rotate(45deg) skew(10deg, 10deg) scale(1.3); border: 4px double #444; background-color: white;}
        .d-5 { border-style: solid; transform: rotate(45deg) skew(15deg, 15deg) scale(1.3); background-color: white; border: 2px solid #333;}
        .d-6 { border-style: solid; transform: rotate(45deg) skew(25deg, 25deg) scale(1.2); background-color: white; border: 2px solid #333;}
        .d-7 { border: 4px double #333; transform: rotate(45deg) skew(25deg, 25deg) scale(1.2); background-color: white;}
        .d-8 { border-style: solid; transform: rotate(45deg) scale(1.0); background-color: white; border: 2px solid #333;}
        .d-9 { border-style: solid; transform: rotate(45deg) scale(1.4); border-color: #007BFF; background-color: white; border: 2px solid #333;} /* 青森 */
        .d-10 { transform: rotate(45deg) skew(20deg, 20deg) scale(1.25); background-color: white; border: 2px solid #333;}
        .d-11 { border-style: solid; transform: rotate(45deg) skew(20deg, 20deg) scale(1.25); background-color: white; border: 2px solid #333;}
        .d-12 { border: 4px double #333; transform: rotate(45deg) scale(1.4); background-color: white;}
        .d-13 { border: 3px double #333; transform: rotate(45deg) skew(10deg, 10deg) scale(1.0); background-color: white;}
        .d-14 { border-style: solid; transform: rotate(45deg) skew(10deg, 10deg) scale(1.3); background-color: white; border: 2px solid #333;}
        .d-15 { border-style: solid; transform: rotate(45deg) scale(0.9); background-color: white; border: 2px solid #333;}
        .d-16, .d-17 { transform: rotate(45deg) scale(1.4); background-color: white; border: 2px solid #333;}
        .d-16::before, .d-17::before {
            content: '';
            position: absolute;
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
            border: 2px solid #333;
        }
        .d-17 { border-width: 4px; background-color: white;}
        .d-17::before { border-width: 1px;}

        /* diamond-displayの背景色をid=1の画像に合わせて設定 */
        #diamond-shape.d-1 {
            background-color: transparent; /* ここはダイヤ自体なので透明に */
        }
        .diamond-display {
            background-color: #6a6a6a; /* id=1の背景色 */
        }
        .diamond-display:not(.d-1-bg) {
            background-color: transparent; /* id=1以外は通常の透明な背景 */
        }


        #options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 2em;
        }

        .option {
            padding: 15px 10px;
            font-size: 1.1em;
            background-color: #e3f2fd;
            border: 2px solid #90caf9;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .option:hover:not(:disabled) {
            background-color: #bbdefb;
            border-color: #64b5f6;
        }
        
        .option:disabled {
            cursor: not-allowed;
            opacity: 0.6; /* 回答済みのボタンを少し暗くする */
        }

        .option.correct {
            background-color: #c8e6c9;
            border-color: #81c784;
            color: #2e7d32;
            font-weight: bold;
        }

        .option.incorrect {
            background-color: #ffcdd2;
            border-color: #e57373;
            color: #c62828;
            font-weight: bold;
        }

        #feedback {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 1em;
            height: 30px;
        }

        #result-screen {
            display: none;
        }
        
        #score {
            font-size: 2.5em;
            color: #d32f2f;
            margin: 0.5em 0;
        }

    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <h1>ダイヤマーク練習用</h1>
            <p>都道府県のダイヤマークを当てるクイズです。<br>全10問、がんばってください！</p>
            <button id="start-button" class="btn">開始</button>
        </div>

        <div id="quiz-screen">
            <h2 id="question-number"></h2>
            <div class="diamond-display">
                <div id="diamond-shape"></div>
            </div>
            <div id="options"></div>
            <div id="feedback"></div>
        </div>

        <div id="result-screen">
            <h1>結果発表</h1>
            <p>あなたのスコアは...</p>
            <div id="score"></div>
            <button id="retry-button" class="btn">もう一度挑戦する</button>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
    
        // クイズデータ
        const quizData = [
            { id: 0, prefs: ['北海道', '青森県', '秋田県', '岩手県', '山形県', '福島県', '東京都', '神奈川県', '福井県', '愛知県', '大阪府', '愛媛県', '福岡県', '長崎県', '宮崎県', '鹿児島県'] },
            { id: 1, prefs: ['宮城県', '京都府', '兵庫県', '岡山県'] }, // このマークのスタイルを修正
            { id: 2, prefs: ['三重県', '高知県'] },
            { id: 3, prefs: ['群馬県', '千葉県', '岐阜県'] },
            { id: 4, prefs: ['奈良県', '和歌山県'] },
            { id: 5, prefs: ['栃木県', '茨城県', '埼玉県', '滋賀県', '沖縄県'] },
            { id: 6, prefs: ['富山県', '大分県'] },
            { id: 7, prefs: ['鳥取県', '島根県', '佐賀県'] },
            { id: 8, prefs: ['香川県'] },
            { id: 9, prefs: ['青森県'] }, // 青森（新）
            { id: 10, prefs: ['広島県', '徳島県'] },
            { id: 11, prefs: ['石川県', '熊本県'] },
            { id: 12, prefs: ['山梨県', '長野県'] },
            { id: 13, prefs: ['奈良県'] }, // 奈良（新）
            { id: 14, prefs: ['茨城県', '新潟県'] }, // 茨城,新潟（新）
            { id: 15, prefs: ['佐賀県'] }, // 佐賀（新）
            { id: 16, prefs: ['静岡県'] },
            { id: 17, prefs: ['長野県', '山口県', '愛知県', '鹿児島県'] }, // 長野,山口,愛知,鹿児島（新）
        ];

        const allPrefectures = Array.from(new Set(quizData.flatMap(item => item.prefs)));

        // DOM要素の取得
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const startButton = document.getElementById('start-button');
        const retryButton = document.getElementById('retry-button');
        const questionNumberEl = document.getElementById('question-number');
        const diamondShapeEl = document.getElementById('diamond-shape');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const scoreEl = document.getElementById('score');
        const diamondDisplayEl = document.querySelector('.diamond-display'); // diamond-display要素も取得

        // クイズの状態
        let score = 0;
        let currentQuestionIndex = 0;
        const totalQuestions = 10;
        let availableQuestions = [];
        let currentCorrectAnswer = '';

        // イベントリスナー
        startButton.addEventListener('click', startQuiz);
        retryButton.addEventListener('click', startQuiz);

        // クイズ開始
        function startQuiz() {
            score = 0;
            currentQuestionIndex = 0;
            availableQuestions = shuffleArray([...quizData]);
            
            startScreen.style.display = 'none';
            resultScreen.style.display = 'none';
            quizScreen.style.display = 'block';

            nextQuestion();
        }

        // 次の問題へ
        function nextQuestion() {
            if (currentQuestionIndex >= totalQuestions) {
                showResult();
                return;
            }
            
            currentQuestionIndex++;
            feedbackEl.textContent = '';
            optionsEl.innerHTML = '';

            const questionData = availableQuestions.pop();
            currentCorrectAnswer = questionData.prefs[Math.floor(Math.random() * questionData.prefs.length)];

            // ダイヤマーク表示
            diamondShapeEl.className = `diamond d-${questionData.id}`;
            // id:1 の場合のみ、diamond-displayの背景色を変更する
            if (questionData.id === 1) {
                diamondDisplayEl.style.backgroundColor = '#6a6a6a'; // 画像の背景色
            } else {
                diamondDisplayEl.style.backgroundColor = 'transparent'; // その他の場合は透明
            }


            // 問題番号表示
            questionNumberEl.textContent = `第${currentQuestionIndex}問`;

            // 選択肢の生成
            const options = generateOptions(currentCorrectAnswer);
            options.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('option');
                button.addEventListener('click', () => checkAnswer(option, button));
                optionsEl.appendChild(button);
            });
        }
        
        // 選択肢を生成（正解1つ＋不正解3つ）
        function generateOptions(correctAnswer) {
            let options = [correctAnswer];
            let dummies = allPrefectures.filter(pref => pref !== correctAnswer);
            dummies = shuffleArray(dummies);
            
            for (let i = 0; i < 3; i++) {
                // 選択肢が重複しないようにチェック
                if (!options.includes(dummies[i])) {
                    options.push(dummies[i]);
                } else {
                    // 重複した場合は別のダミーを探す（十分にダミーがあれば問題ないが念のため）
                    let k = i;
                    while(options.includes(dummies[k]) && k < dummies.length) {
                        k++;
                    }
                    if (k < dummies.length) {
                        options.push(dummies[k]);
                    }
                }
            }
            // 選択肢の数が4つに満たない場合は、さらにランダムな都道府県を追加
            while(options.length < 4) {
                const randomPref = allPrefectures[Math.floor(Math.random() * allPrefectures.length)];
                if (!options.includes(randomPref)) {
                    options.push(randomPref);
                }
            }
            
            return shuffleArray(options);
        }

        // 回答をチェック
        function checkAnswer(selectedOption, button) {
            // 他のボタンをクリックできないようにする
            const optionButtons = document.querySelectorAll('.option');
            optionButtons.forEach(btn => btn.disabled = true);

            if (selectedOption === currentCorrectAnswer) {
                feedbackEl.textContent = '正解！';
                feedbackEl.style.color = '#4caf50';
                button.classList.add('correct');
                score++;
            } else {
                feedbackEl.textContent = `不正解... 正解は ${currentCorrectAnswer}`;
                feedbackEl.style.color = '#f44336';
                button.classList.add('incorrect');
                // 正解の選択肢をハイライト
                optionButtons.forEach(btn => {
                    if (btn.textContent === currentCorrectAnswer) {
                        btn.classList.add('correct');
                    }
                });
            }

            // 1.5秒後に次の問題へ
            setTimeout(nextQuestion, 1500);
        }

        // 結果表示
        function showResult() {
            quizScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            scoreEl.textContent = `${score} / ${totalQuestions}点`;
        }
        
        // 配列をシャッフルするヘルパー関数
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

    });
    </script>
</body>
</html>
