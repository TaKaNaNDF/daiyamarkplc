<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダイヤマーク練習用</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
        }

        .container {
            background-color: #fff;
            padding: 2em;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        h1, h2 { color: #1a237e; margin-top: 0; }
        p { font-size: 1.1em; line-height: 1.6; }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 0.5em;
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
            background-color: #1e88e5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            text-decoration: none;
        }
        .btn:hover:not(:disabled) { background-color: #1565c0; transform: translateY(-2px); }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover:not(:disabled) { background-color: #5a6268; }
        .btn-warning { background-color: #f57c00; }
        .btn-warning:hover:not(:disabled) { background-color: #e65100; }
        .btn:disabled { background-color: #9e9e9e; cursor: not-allowed; }

        .diamond-display {
            width: 150px;
            height: 150px;
            margin: 1.5em auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #diamond-image { max-width: 100%; max-height: 100%; border-radius: 8px; }

        #options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 2em; }
        .option {
            padding: 15px 10px; font-size: 1.1em; background-color: #e3f2fd;
            border: 2px solid #90caf9; border-radius: 8px; cursor: pointer;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .option:hover:not(:disabled) { background-color: #bbdefb; border-color: #64b5f6; }
        .option:disabled { cursor: not-allowed; opacity: 0.6; }
        .option.correct, .correct { background-color: #c8e6c9; border-color: #81c784; color: #2e7d32; font-weight: bold; }
        .option.incorrect, .incorrect { background-color: #ffcdd2; border-color: #e57373; color: #c62828; font-weight: bold; }

        #answer-input {
            width: 80%; padding: 12px; font-size: 1.1em; border: 2px solid #ccc;
            border-radius: 8px; margin-top: 1.5em; text-align: center;
        }
        #answer-input:focus { outline: none; border-color: #1e88e5; }
        #submit-answer { margin-top: 1em; }

        #feedback {
            font-size: 1.2em; font-weight: bold; margin-top: 1em; min-height: 50px;
            display: flex; align-items: center; justify-content: center; line-height: 1.4;
        }
        #score { font-size: 2.5em; color: #d32f2f; margin: 0.5em 0; }

        #incorrect-review-container { margin-top: 2em; text-align: left; }
        #incorrect-review-container h2 {
            font-size: 1.2em; color: #333; border-bottom: 2px solid #1e88e5;
            padding-bottom: 0.5em; margin-bottom: 1em;
        }
        #incorrect-list {
            max-height: 250px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-right: 10px;
        }
        .incorrect-item {
            display: flex; align-items: center; margin-bottom: 1em; padding: 10px;
            background-color: #f9f9f9; border-radius: 8px; border: 1px solid #ddd;
        }
        .incorrect-item img { width: 60px; height: 60px; margin-right: 15px; border-radius: 4px; flex-shrink: 0; }
        .incorrect-item-answer { font-size: 1em; font-weight: bold; color: #c62828; }

    </style>
</head>

<body>
    <div class="container">
        <div id="home-screen" class="screen active">
            <h1>ダイヤマーク練習用</h1>
            <p>クイズのモードを選んでください。</p>
            <button id="choice-quiz-btn" class="btn">4択クイズ</button>
            <button id="typing-quiz-btn" class="btn">記述クイズ</button>
            <button id="typing-all-quiz-btn" class="btn btn-warning">全答記述クイズ</button>
        </div>

        <div id="quiz-screen" class="screen">
            <h2 id="question-number"></h2>
            <div id="question-instruction" style="font-size: 0.9em; color: #555; min-height: 20px;"></div>
            <div class="diamond-display">
                <img id="diamond-image" src="" alt="ダイヤマーク">
            </div>
            <div id="options-container">
                <div id="options"></div>
            </div>
            <div id="typing-container">
                <input type="text" id="answer-input" placeholder="都道府県名を入力">
                <button id="submit-answer" class="btn">回答する</button>
            </div>
            <div id="feedback"></div>
        </div>

        <div id="result-screen" class="screen">
            <h1>結果発表</h1>
            <p>あなたのスコアは...</p>
            <div id="score"></div>
            <div id="incorrect-review-container">
                <h2>不正解だった問題</h2>
                <div id="incorrect-list"></div>
            </div>
            <button id="retry-incorrect-btn" class="btn btn-warning">間違えた問題だけ復習</button>
            <button id="retry-button" class="btn">もう一度挑戦する</button>
            <button id="home-button" class="btn btn-secondary">ホームに戻る</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const quizData = [
                { id: 0, prefs: ['北海道', '青森県', '秋田県', '岩手県', '山形県', '福島県', '東京都', '神奈川県', '福井県', '愛知県', '大阪府', '愛媛県', '福岡県', '長崎県', '宮崎県', '鹿児島県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya.png' },
                { id: 1, prefs: ['宮城県', '京都府', '兵庫県', '岡山県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya1.png' },
                { id: 2, prefs: ['三重県', '高知県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya2.png' },
                { id: 3, prefs: ['群馬県', '千葉県', '岐阜県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya3.png' },
                { id: 4, prefs: ['奈良県', '和歌山県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya4.png' },
                { id: 5, prefs: ['栃木県', '茨城県', '埼玉県', '滋賀県', '沖縄県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya5.png' },
                { id: 6, prefs: ['富山県', '大分県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya6.png' },
                { id: 7, prefs: ['鳥取県', '島根県', '佐賀県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya7.png' },
                { id: 8, prefs: ['香川県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya8.png' },
                { id: 9, prefs: ['青森県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya9.png' },
                { id: 10, prefs: ['広島県', '徳島県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya10.png' },
                { id: 11, prefs: ['石川県', '熊本県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya11.png' },
                { id: 12, prefs: ['山梨県', '長野県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya12.png' },
                { id: 13, prefs: ['奈良県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya13.png' },
                { id: 14, prefs: ['茨城県', '新潟県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya14.png' },
                { id: 15, prefs: ['佐賀県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya15.png' },
                { id: 16, prefs: ['静岡県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya16.png' },
                { id: 17, prefs: ['長野県', '山口県', '愛知県', '鹿児島県'], imageUrl: 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/daiya17.png' },
            ];

            // ... (DOM要素取得のコードは変更なし)
            const allPrefectures = Array.from(new Set(quizData.flatMap(item => item.prefs)));
            const screens = document.querySelectorAll('.screen');
            const choiceQuizBtn = document.getElementById('choice-quiz-btn');
            const typingQuizBtn = document.getElementById('typing-quiz-btn');
            const typingAllQuizBtn = document.getElementById('typing-all-quiz-btn');
            const retryButton = document.getElementById('retry-button');
            const retryIncorrectBtn = document.getElementById('retry-incorrect-btn');
            const homeButton = document.getElementById('home-button');
            const questionInstructionEl = document.getElementById('question-instruction');
            const questionNumberEl = document.getElementById('question-number');
            const diamondImageEl = document.getElementById('diamond-image');
            const optionsContainer = document.getElementById('options-container');
            const optionsEl = document.getElementById('options');
            const typingContainer = document.getElementById('typing-container');
            const answerInput = document.getElementById('answer-input');
            const submitAnswerBtn = document.getElementById('submit-answer');
            const feedbackEl = document.getElementById('feedback');
            const scoreEl = document.getElementById('score');
            const incorrectListEl = document.getElementById('incorrect-list');
            const incorrectReviewContainer = document.getElementById('incorrect-review-container');


            let score = 0, currentQuestionIndex = 0, totalQuestions = 10;
            let availableQuestions = [], incorrectQuestions = [];
            let currentQuestionData = null, currentCorrectGroup = [];
            let quizMode = '', originalQuizMode = '';

            // イベントリスナー
            choiceQuizBtn.addEventListener('click', () => startQuiz('choice', shuffleArray([...quizData]), 10));
            typingQuizBtn.addEventListener('click', () => startQuiz('typing', shuffleArray([...quizData]), 10));
            typingAllQuizBtn.addEventListener('click', () => {
                const allAnswerQuestions = quizData.filter(q => q.id !== 0);
                startQuiz('typing-all', shuffleArray(allAnswerQuestions), allAnswerQuestions.length);
            });
            retryButton.addEventListener('click', () => {
                 const questionsForRetry = originalQuizMode === 'typing-all' ? quizData.filter(q => q.id !== 0) : [...quizData];
                 const numQuestions = originalQuizMode === 'typing-all' ? questionsForRetry.length : 10;
                 startQuiz(originalQuizMode, shuffleArray(questionsForRetry), numQuestions);
            });
            retryIncorrectBtn.addEventListener('click', () => startQuiz(originalQuizMode, shuffleArray([...incorrectQuestions]), incorrectQuestions.length));
            homeButton.addEventListener('click', () => switchScreen('home-screen'));
            submitAnswerBtn.addEventListener('click', checkTypingAnswer);
            answerInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkTypingAnswer(); });

            function switchScreen(screenId) {
                screens.forEach(screen => screen.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');
            }

            function startQuiz(mode, questions, numQuestions) {
                quizMode = mode;
                if (!mode.includes('review')) {
                    originalQuizMode = mode;
                }
                score = 0;
                currentQuestionIndex = 0;
                availableQuestions = questions;
                totalQuestions = numQuestions;
                incorrectQuestions = [];

                optionsContainer.style.display = quizMode === 'choice' ? 'block' : 'none';
                typingContainer.style.display = quizMode.startsWith('typing') ? 'block' : 'none';
                questionInstructionEl.textContent = quizMode === 'typing-all' ? '該当する都道府県をスペース区切りで全て入力してください' : '';
                
                switchScreen('quiz-screen');
                nextQuestion();
            }

            function nextQuestion() {
                if (currentQuestionIndex >= totalQuestions || availableQuestions.length === 0) {
                    showResult();
                    return;
                }
                currentQuestionIndex++;
                feedbackEl.innerHTML = '';
                currentQuestionData = availableQuestions.pop();
                currentCorrectGroup = currentQuestionData.prefs;
                diamondImageEl.src = currentQuestionData.imageUrl;
                questionNumberEl.textContent = `第${currentQuestionIndex}問 / 全${totalQuestions}問`;

                if (quizMode === 'choice') {
                    optionsEl.innerHTML = '';
                    const correctAnswer = currentCorrectGroup[Math.floor(Math.random() * currentCorrectGroup.length)];
                    const options = generateChoiceOptions(correctAnswer, currentCorrectGroup);
                    options.forEach(option => {
                        const button = document.createElement('button');
                        button.textContent = option;
                        button.classList.add('option');
                        button.addEventListener('click', () => checkChoiceAnswer(option, button));
                        optionsEl.appendChild(button);
                    });
                } else {
                    answerInput.value = '';
                    answerInput.disabled = false;
                    submitAnswerBtn.disabled = false;
                    answerInput.focus();
                }
            }

            function generateChoiceOptions(correctAnswer, correctGroup) {
                let options = [correctAnswer];
                let dummies = allPrefectures.filter(pref => !correctGroup.includes(pref));
                dummies = shuffleArray(dummies);
                for (let i = 0; i < 3 && i < dummies.length; i++) {
                    options.push(dummies[i]);
                }
                return shuffleArray(options);
            }

            function checkChoiceAnswer(selectedOption, button) {
                const optionButtons = document.querySelectorAll('.option');
                optionButtons.forEach(btn => btn.disabled = true);
                const isCorrect = currentCorrectGroup.includes(selectedOption);
                const answerText = `正解は: ${currentCorrectGroup.join('、')}`;
                
                if (isCorrect) {
                    score++;
                    feedbackEl.innerHTML = `正解！<br>${answerText}`;
                    feedbackEl.style.color = '#4caf50';
                    button.classList.add('correct');
                } else {
                    incorrectQuestions.push(currentQuestionData);
                    feedbackEl.innerHTML = `不正解...<br>${answerText}`;
                    feedbackEl.style.color = '#f44336';
                    button.classList.add('incorrect');
                    optionButtons.forEach(btn => {
                        if (currentCorrectGroup.includes(btn.textContent)) btn.classList.add('correct');
                    });
                }
                setTimeout(nextQuestion, 2500);
            }

            function checkTypingAnswer() {
                const userInput = answerInput.value.trim();
                if (!userInput) return;
                answerInput.disabled = true;
                submitAnswerBtn.disabled = true;

                // ▼▼▼【今回の修正箇所】▼▼▼
                // 都道府県名を正しく単純化（正規化）する関数
                const normalize = (pref) => {
                    if (pref === '北海道') {
                        return '北海道'; // 北海道は特別扱い
                    }
                    // 末尾の「都」「府」「県」のみを削除
                    return pref.replace(/(都|府|県)$/, '');
                };
                // ▲▲▲【今回の修正箇所】▲▲▲

                let isCorrect = false;

                if (quizMode === 'typing-all') {
                    const userAnswers = userInput.split(/\s+/).map(normalize).filter(Boolean).sort();
                    const correctAnswers = currentCorrectGroup.map(normalize).sort();
                    isCorrect = userAnswers.length === correctAnswers.length && userAnswers.every((val, index) => val === correctAnswers[index]);
                } else {
                    const normalizedInput = normalize(userInput.replace(/（|）|\s/g, ''));
                    const normalizedAnswers = currentCorrectGroup.map(normalize);
                    isCorrect = normalizedAnswers.includes(normalizedInput);
                }

                const answerText = `正解は: ${currentCorrectGroup.join('、')}`;
                if (isCorrect) {
                    score++;
                    feedbackEl.innerHTML = `正解！<br>${answerText}`;
                    feedbackEl.style.color = '#4caf50';
                    answerInput.classList.add('correct');
                } else {
                    incorrectQuestions.push(currentQuestionData);
                    feedbackEl.innerHTML = `不正解...<br>${answerText}`;
                    feedbackEl.style.color = '#f44336';
                    answerInput.classList.add('incorrect');
                }
                setTimeout(() => {
                    answerInput.classList.remove('correct', 'incorrect');
                    nextQuestion();
                }, 2500);
            }

            function showResult() {
                switchScreen('result-screen');
                scoreEl.textContent = `${score} / ${totalQuestions}点`;
                retryIncorrectBtn.style.display = incorrectQuestions.length > 0 ? 'inline-block' : 'none';
                
                incorrectListEl.innerHTML = '';
                if (incorrectQuestions.length > 0) {
                    incorrectReviewContainer.style.display = 'block';
                    [...incorrectQuestions].reverse().forEach(item => {
                        const itemEl = document.createElement('div');
                        itemEl.classList.add('incorrect-item');
                        itemEl.innerHTML = `<img src="${item.imageUrl}" alt="ダイヤマーク"><div class="incorrect-item-answer">${item.prefs.join('、')}</div>`;
                        incorrectListEl.appendChild(itemEl);
                    });
                } else {
                    incorrectReviewContainer.style.display = 'block';
                    incorrectListEl.innerHTML = '<p style="text-align:center; font-weight:bold; color:#1e88e5;">全問正解です！おめでとうございます！🎉</p>';
                }
            }

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }
        });
    </script>
</body>

</html>
