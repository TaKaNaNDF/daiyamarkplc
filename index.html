<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダイヤマーク練習用</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
        }

        .container {
            background-color: #fff;
            padding: 2em;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
        }

        h1 {
            color: #1a237e;
            margin-top: 0;
        }

        #start-screen p {
            font-size: 1.1em;
            margin-bottom: 2em;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            background-color: #1e88e5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            text-decoration: none;
        }

        .btn:hover:not(:disabled) {
            background-color: #1565c0;
            transform: translateY(-2px);
        }

        #quiz-screen {
            display: none;
        }

        .diamond-display {
            width: 150px;
            height: 150px;
            margin: 1.5em auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #diamond-image {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
        }

        #options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 2em;
        }

        .option {
            padding: 15px 10px;
            font-size: 1.1em;
            background-color: #e3f2fd;
            border: 2px solid #90caf9;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .option:hover:not(:disabled) {
            background-color: #bbdefb;
            border-color: #64b5f6;
        }
        
        .option:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option.correct {
            background-color: #c8e6c9;
            border-color: #81c784;
            color: #2e7d32;
            font-weight: bold;
        }

        .option.incorrect {
            background-color: #ffcdd2;
            border-color: #e57373;
            color: #c62828;
            font-weight: bold;
        }

        #feedback {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 1em;
            height: 30px;
        }

        #result-screen {
            display: none;
        }
        
        #score {
            font-size: 2.5em;
            color: #d32f2f;
            margin: 0.5em 0;
        }

    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <h1>ダイヤマーク練習用</h1>
            <p>都道府県のダイヤマークを当てるクイズです。<br>全10問、がんばってください！</p>
            <button id="start-button" class="btn">開始</button>
        </div>

        <div id="quiz-screen">
            <h2 id="question-number"></h2>
            <div class="diamond-display">
                <img id="diamond-image" src="" alt="ダイヤマーク">
            </div>
            <div id="options"></div>
            <div id="feedback"></div>
        </div>

        <div id="result-screen">
            <h1>結果発表</h1>
            <p>あなたのスコアは...</p>
            <div id="score"></div>
            <button id="retry-button" class="btn">もう一度挑戦する</button>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        
        const imageUrlBase = 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/';

        const quizData = [
            { id: 0, prefs: ['北海道', '青森県', '秋田県', '岩手県', '山形県', '福島県', '東京都', '神奈川県', '福井県', '愛知県', '大阪府', '愛媛県', '福岡県', '長崎県', '宮崎県', '鹿児島県'], imageUrl: `${imageUrlBase}daiya.png` },
            { id: 1, prefs: ['宮城県', '京都府', '兵庫県', '岡山県'], imageUrl: `${imageUrlBase}daiya1.png` },
            { id: 2, prefs: ['三重県', '高知県'], imageUrl: `${imageUrlBase}daiya2.png` },
            { id: 3, prefs: ['群馬県', '千葉県', '岐阜県'], imageUrl: `${imageUrlBase}daiya3.png` },
            { id: 4, prefs: ['奈良県', '和歌山県'], imageUrl: `${imageUrlBase}daiya4.png` },
            { id: 5, prefs: ['栃木県', '茨城県', '埼玉県', '滋賀県', '沖縄県'], imageUrl: `${imageUrlBase}daiya5.png` },
            { id: 6, prefs: ['富山県', '大分県'], imageUrl: `${imageUrlBase}daiya6.png` },
            { id: 7, prefs: ['鳥取県', '島根県', '佐賀県'], imageUrl: `${imageUrlBase}daiya7.png` },
            { id: 8, prefs: ['香川県'], imageUrl: `${imageUrlBase}daiya8.png` },
            { id: 9, prefs: ['青森県'], imageUrl: `${imageUrlBase}daiya9.png` },
            { id: 10, prefs: ['広島県', '徳島県'], imageUrl: `${imageUrlBase}daiya10.png` },
            { id: 11, prefs: ['石川県', '熊本県'], imageUrl: `${imageUrlBase}daiya11.png` },
            { id: 12, prefs: ['山梨県', '長野県'], imageUrl: `${imageUrlBase}daiya12.png` },
            { id: 13, prefs: ['奈良県'], imageUrl: `${imageUrlBase}daiya13.png` },
            { id: 14, prefs: ['茨城県', '新潟県'], imageUrl: `${imageUrlBase}daiya14.png` },
            { id: 15, prefs: ['佐賀県'], imageUrl: `${imageUrlBase}daiya15.png` },
            { id: 16, prefs: ['静岡県'], imageUrl: `${imageUrlBase}daiya16.png` },
            { id: 17, prefs: ['長野県', '山口県', '愛知県', '鹿児島県'], imageUrl: `${imageUrlBase}daiya17.png` },
        ];

        const allPrefectures = Array.from(new Set(quizData.flatMap(item => item.prefs)));

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const startButton = document.getElementById('start-button');
        const retryButton = document.getElementById('retry-button');
        const questionNumberEl = document.getElementById('question-number');
        const diamondImageEl = document.getElementById('diamond-image'); 
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const scoreEl = document.getElementById('score');

        let score = 0;
        let currentQuestionIndex = 0;
        const totalQuestions = 10;
        let availableQuestions = [];
        let currentCorrectAnswer = '';

        startButton.addEventListener('click', startQuiz);
        retryButton.addEventListener('click', startQuiz);

        function startQuiz() {
            score = 0;
            currentQuestionIndex = 0;
            availableQuestions = shuffleArray([...quizData]);
            
            startScreen.style.display = 'none';
            resultScreen.style.display = 'none';
            quizScreen.style.display = 'block';

            nextQuestion();
        }

        function nextQuestion() {
            if (currentQuestionIndex >= totalQuestions) {
                showResult();
                return;
            }
            
            currentQuestionIndex++;
            feedbackEl.textContent = '';
            optionsEl.innerHTML = '';

            const questionData = availableQuestions.pop();
            currentCorrectAnswer = questionData.prefs[Math.floor(Math.random() * questionData.prefs.length)];
            
            diamondImageEl.src = questionData.imageUrl;
            questionNumberEl.textContent = `第${currentQuestionIndex}問`;
            
            // ▼▼▼ 修正点 ▼▼▼
            // questionData.prefs (現在の問題の正解グループ) を渡して選択肢を生成
            const options = generateOptions(currentCorrectAnswer, questionData.prefs);
            options.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('option');
                button.addEventListener('click', () => checkAnswer(option, button));
                optionsEl.appendChild(button);
            });
        }
        
        // ▼▼▼ 修正点 ▼▼▼
        // 選択肢を生成する関数を修正
        function generateOptions(correctAnswer, correctGroup) {
            let options = [correctAnswer];
            
            // ダミーの選択肢を「正解グループに含まれない」都道府県からのみ選ぶ
            let dummies = allPrefectures.filter(pref => !correctGroup.includes(pref));
            dummies = shuffleArray(dummies);
            
            // ダミーを3つ追加する
            for (let i = 0; i < 3; i++) {
                options.push(dummies[i]);
            }
            
            // 最終的な選択肢（正解1+不正解3）をシャッフルして返す
            return shuffleArray(options);
        }

        function checkAnswer(selectedOption, button) {
            const optionButtons = document.querySelectorAll('.option');
            optionButtons.forEach(btn => btn.disabled = true);

            if (selectedOption === currentCorrectAnswer) {
                feedbackEl.textContent = '正解！';
                feedbackEl.style.color = '#4caf50';
                button.classList.add('correct');
                score++;
            } else {
                feedbackEl.textContent = `不正解... 正解は ${currentCorrectAnswer}`;
                feedbackEl.style.color = '#f44336';
                button.classList.add('incorrect');
                optionButtons.forEach(btn => {
                    if (btn.textContent === currentCorrectAnswer) {
                        btn.classList.add('correct');
                    }
                });
            }
            setTimeout(nextQuestion, 1500);
        }

        function showResult() {
            quizScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            scoreEl.textContent = `${score} / ${totalQuestions}点`;
        }
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
    });
    </script>
</body>
</html>
