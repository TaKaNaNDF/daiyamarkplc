<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダイヤマーク練習用</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
        }

        .container {
            background-color: #fff;
            padding: 2em;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
        }
        
        /* 画面切り替えの基本スタイル */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        h1, h2 {
            color: #1a237e;
            margin-top: 0;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            margin: 0.5em;
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            background-color: #1e88e5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            text-decoration: none;
        }
        .btn:hover:not(:disabled) {
            background-color: #1565c0;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: #5a6268;
        }


        .diamond-display {
            width: 150px;
            height: 150px;
            margin: 1.5em auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #diamond-image {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
        }

        #options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 2em;
        }

        .option {
            padding: 15px 10px;
            font-size: 1.1em;
            background-color: #e3f2fd;
            border: 2px solid #90caf9;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .option:hover:not(:disabled) {
            background-color: #bbdefb;
            border-color: #64b5f6;
        }
        
        .option:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option.correct, .correct {
            background-color: #c8e6c9;
            border-color: #81c784;
            color: #2e7d32;
            font-weight: bold;
        }

        .option.incorrect, .incorrect {
            background-color: #ffcdd2;
            border-color: #e57373;
            color: #c62828;
            font-weight: bold;
        }
        
        /* 記述式クイズ用スタイル */
        #answer-input {
            width: 80%;
            padding: 12px;
            font-size: 1.1em;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-top: 1.5em;
            text-align: center;
        }
        #answer-input:focus {
            outline: none;
            border-color: #1e88e5;
        }
        #submit-answer {
            margin-top: 1em;
        }
        

        #feedback {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 1em;
            height: 30px; /* 高さを固定してレイアウトのガタつきを防ぐ */
        }
        
        #score {
            font-size: 2.5em;
            color: #d32f2f;
            margin: 0.5em 0;
        }

    </style>
</head>
<body>

    <div class="container">
        <div id="home-screen" class="screen active">
            <h1>ダイヤマーク練習用</h1>
            <p>クイズのモードを選んでください。</p>
            <button id="choice-quiz-btn" class="btn">4択クイズ</button>
            <button id="typing-quiz-btn" class="btn">記述クイズ</button>
        </div>

        <div id="quiz-screen" class="screen">
            <h2 id="question-number"></h2>
            <div class="diamond-display">
                <img id="diamond-image" src="" alt="ダイヤマーク">
            </div>
            <div id="options-container">
                <div id="options"></div>
            </div>
            <div id="typing-container">
                <input type="text" id="answer-input" placeholder="都道府県名を入力">
                <button id="submit-answer" class="btn">回答する</button>
            </div>
            <div id="feedback"></div>
        </div>

        <div id="result-screen" class="screen">
            <h1>結果発表</h1>
            <p>あなたのスコアは...</p>
            <div id="score"></div>
            <button id="retry-button" class="btn">もう一度挑戦する</button>
            <button id="home-button" class="btn btn-secondary">ホームに戻る</button>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        
        const imageUrlBase = 'https://raw.githubusercontent.com/TaKaNaNDF/daiyamarkplc/main/';

        const quizData = [
            { id: 0, prefs: ['北海道', '青森県', '秋田県', '岩手県', '山形県', '福島県', '東京都', '神奈川県', '福井県', '愛知県', '大阪府', '愛媛県', '福岡県', '長崎県', '宮崎県', '鹿児島県'], imageUrl: `${imageUrlBase}daiya.png` },
            { id: 1, prefs: ['宮城県', '京都府', '兵庫県', '岡山県'], imageUrl: `${imageUrlBase}daiya1.png` },
            { id: 2, prefs: ['三重県', '高知県'], imageUrl: `${imageUrlBase}daiya2.png` },
            { id: 3, prefs: ['群馬県', '千葉県', '岐阜県'], imageUrl: `${imageUrlBase}daiya3.png` },
            { id: 4, prefs: ['奈良県', '和歌山県'], imageUrl: `${imageUrlBase}daiya4.png` },
            { id: 5, prefs: ['栃木県', '茨城県', '埼玉県', '滋賀県', '沖縄県'], imageUrl: `${imageUrlBase}daiya5.png` },
            { id: 6, prefs: ['富山県', '大分県'], imageUrl: `${imageUrlBase}daiya6.png` },
            { id: 7, prefs: ['鳥取県', '島根県', '佐賀県'], imageUrl: `${imageUrlBase}daiya7.png` },
            { id: 8, prefs: ['香川県'], imageUrl: `${imageUrlBase}daiya8.png` },
            { id: 9, prefs: ['青森県'], imageUrl: `${imageUrlBase}daiya9.png` },
            { id: 10, prefs: ['広島県', '徳島県'], imageUrl: `${imageUrlBase}daiya10.png` },
            { id: 11, prefs: ['石川県', '熊本県'], imageUrl: `${imageUrlBase}daiya11.png` },
            { id: 12, prefs: ['山梨県', '長野県'], imageUrl: `${imageUrlBase}daiya12.png` },
            { id: 13, prefs: ['奈良県'], imageUrl: `${imageUrlBase}daiya13.png` },
            { id: 14, prefs: ['茨城県', '新潟県'], imageUrl: `${imageUrlBase}daiya14.png` },
            { id: 15, prefs: ['佐賀県'], imageUrl: `${imageUrlBase}daiya15.png` },
            { id: 16, prefs: ['静岡県'], imageUrl: `${imageUrlBase}daiya16.png` },
            { id: 17, prefs: ['長野県', '山口県', '愛知県', '鹿児島県'], imageUrl: `${imageUrlBase}daiya17.png` },
        ];

        const allPrefectures = Array.from(new Set(quizData.flatMap(item => item.prefs)));

        // DOM要素
        const screens = document.querySelectorAll('.screen');
        const homeScreen = document.getElementById('home-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const choiceQuizBtn = document.getElementById('choice-quiz-btn');
        const typingQuizBtn = document.getElementById('typing-quiz-btn');
        const retryButton = document.getElementById('retry-button');
        const homeButton = document.getElementById('home-button');
        
        const questionNumberEl = document.getElementById('question-number');
        const diamondImageEl = document.getElementById('diamond-image'); 
        const optionsContainer = document.getElementById('options-container');
        const optionsEl = document.getElementById('options');
        const typingContainer = document.getElementById('typing-container');
        const answerInput = document.getElementById('answer-input');
        const submitAnswerBtn = document.getElementById('submit-answer');
        const feedbackEl = document.getElementById('feedback');
        const scoreEl = document.getElementById('score');

        // クイズの状態
        let score = 0;
        let currentQuestionIndex = 0;
        const totalQuestions = 10;
        let availableQuestions = [];
        let currentCorrectGroup = []; // 正解のグループ (e.g., ['宮城県', '京都府', ...])
        let quizMode = ''; // 'choice' or 'typing'

        // イベントリスナー
        choiceQuizBtn.addEventListener('click', () => startQuiz('choice'));
        typingQuizBtn.addEventListener('click', () => startQuiz('typing'));
        retryButton.addEventListener('click', () => startQuiz(quizMode));
        homeButton.addEventListener('click', showHomeScreen);
        submitAnswerBtn.addEventListener('click', checkTypingAnswer);
        answerInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkTypingAnswer();
        });

        // 画面切り替え関数
        function switchScreen(screenId) {
            screens.forEach(screen => screen.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
        
        function showHomeScreen() {
            switchScreen('home-screen');
        }

        // クイズ開始
        function startQuiz(mode) {
            quizMode = mode;
            score = 0;
            currentQuestionIndex = 0;
            availableQuestions = shuffleArray([...quizData]);
            
            // モードに応じてUIを切り替え
            if (quizMode === 'choice') {
                optionsContainer.style.display = 'block';
                typingContainer.style.display = 'none';
            } else { // typing
                optionsContainer.style.display = 'none';
                typingContainer.style.display = 'block';
            }

            switchScreen('quiz-screen');
            nextQuestion();
        }

        // 次の問題へ
        function nextQuestion() {
            if (currentQuestionIndex >= totalQuestions) {
                showResult();
                return;
            }
            
            currentQuestionIndex++;
            feedbackEl.textContent = '';
            
            const questionData = availableQuestions.pop();
            currentCorrectGroup = questionData.prefs; // 正解グループを保存
            
            diamondImageEl.src = questionData.imageUrl;
            questionNumberEl.textContent = `第${currentQuestionIndex}問`;

            if (quizMode === 'choice') {
                optionsEl.innerHTML = '';
                const correctAnswer = currentCorrectGroup[Math.floor(Math.random() * currentCorrectGroup.length)];
                const options = generateChoiceOptions(correctAnswer, currentCorrectGroup);
                options.forEach(option => {
                    const button = document.createElement('button');
                    button.textContent = option;
                    button.classList.add('option');
                    button.addEventListener('click', () => checkChoiceAnswer(option, correctAnswer, button));
                    optionsEl.appendChild(button);
                });
            } else { // typing
                answerInput.value = '';
                answerInput.disabled = false;
                submitAnswerBtn.disabled = false;
                answerInput.focus();
            }
        }
        
        // 4択クイズの選択肢を生成
        function generateChoiceOptions(correctAnswer, correctGroup) {
            let options = [correctAnswer];
            let dummies = allPrefectures.filter(pref => !correctGroup.includes(pref));
            dummies = shuffleArray(dummies);
            for (let i = 0; i < 3; i++) {
                options.push(dummies[i]);
            }
            return shuffleArray(options);
        }

        // 4択クイズの回答をチェック
        function checkChoiceAnswer(selectedOption, correctAnswer, button) {
            const optionButtons = document.querySelectorAll('.option');
            optionButtons.forEach(btn => btn.disabled = true);

            if (selectedOption === correctAnswer) {
                feedbackEl.textContent = '正解！';
                feedbackEl.style.color = '#4caf50';
                button.classList.add('correct');
                score++;
            } else {
                feedbackEl.textContent = `不正解... 正解は ${correctAnswer}`;
                feedbackEl.style.color = '#f44336';
                button.classList.add('incorrect');
                optionButtons.forEach(btn => {
                    if (btn.textContent === correctAnswer) btn.classList.add('correct');
                });
            }
            setTimeout(nextQuestion, 1500);
        }

        // 記述クイズの回答をチェック
        function checkTypingAnswer() {
            const userInput = answerInput.value.trim();
            if (!userInput) return; // 空欄の場合は何もしない

            answerInput.disabled = true;
            submitAnswerBtn.disabled = true;

            // 「県」「府」「都」「道」を許容する正規化
            const normalizedInput = userInput.replace(/（|）|\s/g, '').replace(/県|府|都|道$/, '');
            const normalizedAnswers = currentCorrectGroup.map(pref => pref.replace(/県|府|都|道$/, ''));
            
            if (normalizedAnswers.includes(normalizedInput)) {
                score++;
                feedbackEl.textContent = '正解！';
                feedbackEl.style.color = '#4caf50';
                answerInput.classList.add('correct');
                answerInput.classList.remove('incorrect');
            } else {
                feedbackEl.textContent = `不正解... 正解は ${currentCorrectGroup.join('、')}`;
                feedbackEl.style.color = '#f44336';
                answerInput.classList.add('incorrect');
                answerInput.classList.remove('correct');
            }
            setTimeout(() => {
                answerInput.classList.remove('correct', 'incorrect');
                nextQuestion();
            }, 2000); // 記述式は少し長めに表示
        }


        // 結果表示
        function showResult() {
            switchScreen('result-screen');
            scoreEl.textContent = `${score} / ${totalQuestions}点`;
        }
        
        // 配列シャッフル関数
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
    });
    </script>
</body>
</html>
